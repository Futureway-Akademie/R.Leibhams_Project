# Lokale Entwicklungsinfrastruktur. Nicht für Produktion: MongoDB läuft ohne Authentifizierung
# und ist deshalb ausschließlich an 127.0.0.1 gebunden.
name: fw-booking

services:
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initialisiert das Single-Node-Replica-Set beim ersten Lauf; danach nur Statusprüfung.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  mongo-data:
