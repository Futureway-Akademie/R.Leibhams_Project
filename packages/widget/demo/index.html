<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget-Demo</title>
    <!-- Lokale Prüfseite für das gebaute Bundle (pnpm --filter @fw-booking/widget demo).
         Optional: ?calendar=cal_…&api=http://127.0.0.1:3000 verwendet echte Werte,
         &service=<Angebots-ID> legt Kalender B auf ein Angebot fest,
         &theme=dark zeigt das Widget auf dunklem Hintergrund mit überschriebenen Custom Properties. -->
    <link rel="stylesheet" href="/dist/fw-booking-widget.css" />
    <style>
      /* Simuliertes Theme mit globalen Element-Styles, gegen die der Reset bestehen muss. */
      body {
        font-family: Georgia, serif;
        max-width: 56rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      button {
        background: #ff0;
        border: 3px dashed #f0f;
        text-transform: uppercase;
      }
      ul {
        list-style: square;
        padding-left: 3rem;
      }
      h3,
      h4 {
        color: #c00;
        margin: 2rem 0;
      }
      table td {
        border: 2px solid #0a0;
        padding: 1rem;
      }
      body.dark {
        background: #111827;
        color: #e5e7eb;
      }
      body.dark .fw-booking-root {
        --fw-booking-color-muted: #a1a1aa;
        --fw-booking-color-accent: #60a5fa;
        --fw-booking-color-accent-text: #0b1220;
        --fw-booking-color-error: #fca5a5;
        --fw-booking-color-warning: #fcd34d;
        --fw-booking-color-success: #86efac;
      }
    </style>
    <script>
      const params = new URLSearchParams(location.search);
      window.demoConfig = {
        calendar: params.get('calendar') ?? 'cal_DemoDemoDemoDemo',
        api: params.get('api') ?? 'http://127.0.0.1:3000',
        service: params.get('service'),
      };
    </script>
    <!-- Absichtlich doppelt eingebunden, wie bei mehreren Shortcodes auf einer Seite. -->
    <script src="/dist/fw-booking-widget.js"></script>
    <script src="/dist/fw-booking-widget.js"></script>
  </head>
  <body>
    <script>
      if (new URLSearchParams(location.search).get('theme') === 'dark') {
        document.body.classList.add('dark');
      }
    </script>
    <h1>Widget-Demo</h1>

    <h2>Kalender A</h2>
    <div id="a" class="demo-calendar"></div>

    <h2>Kalender B (optional festes Angebot)</h2>
    <div id="b" class="demo-calendar"></div>

    <h2>Fehlerhafte Einbindung</h2>
    <div
      id="broken"
      data-fw-booking-calendar="ungueltig"
      data-fw-booking-api="http://127.0.0.1:3000"
      data-fw-booking-privacy-url="/demo/datenschutz.html"
    ></div>

    <h2>Nachträglich eingefügt</h2>
    <button id="add" type="button">Container einfügen und FwBooking.scan() aufrufen</button>
    <div id="later"></div>

    <h2>Angebote laden (API-Client von Kalender A)</h2>
    <button id="load" type="button">getServices()</button>
    <pre id="out"></pre>

    <script>
      for (const id of ['a', 'b']) {
        const el = document.getElementById(id);
        el.setAttribute('data-fw-booking-calendar', window.demoConfig.calendar);
        el.setAttribute('data-fw-booking-api', window.demoConfig.api);
        el.setAttribute('data-fw-booking-privacy-url', '/demo/datenschutz.html');
      }
      if (window.demoConfig.service) {
        document
          .getElementById('b')
          .setAttribute('data-fw-booking-service', window.demoConfig.service);
      }
      document.addEventListener('fw-booking:select', (event) => {
        console.info('fw-booking:select', event.target.id, event.detail);
      });
      document.getElementById('add').addEventListener('click', () => {
        const el = document.createElement('div');
        el.setAttribute('data-fw-booking-calendar', window.demoConfig.calendar);
        el.setAttribute('data-fw-booking-api', window.demoConfig.api);
        el.setAttribute('data-fw-booking-privacy-url', '/demo/datenschutz.html');
        document.getElementById('later').append(el);
        window.FwBooking.scan(document.getElementById('later'));
      });
      document.getElementById('load').addEventListener('click', async () => {
        const out = document.getElementById('out');
        const instance = window.FwBooking.mount(document.getElementById('a'));
        try {
          const result = await instance.api.getServices();
          out.textContent = JSON.stringify(result, null, 2);
        } catch (error) {
          out.textContent = `${error.name}: ${error.kind} ${error.status ?? ''} ${error.code ?? ''}`;
        }
      });
    </script>
    <!-- Ein drittes Mal am Ende der Seite. -->
    <script src="/dist/fw-booking-widget.js"></script>
  </body>
</html>
